# Configuration nginx du frontend ParcAuto.
#
# Le serveur sert les fichiers statiques ET relaie l'API vers le backend : tout
# passe par une seule origine. Conséquence directe : pas de CORS à configurer,
# pas de contenu mixte, et le build est indépendant du domaine.
#
# L'adresse du backend est définie une seule fois ci-dessous (upstream). Elle
# dépend d'où tourne NGINX, pas d'où tourne le backend :
#
#   - nginx sur l'hôte, backend sur l'hôte ou publié par Docker
#       → 127.0.0.1:8080                                        (défaut)
#   - nginx DANS un conteneur, backend dans un autre du même réseau
#       → nom-du-service:8080
#   - nginx dans un conteneur, backend sur l'hôte
#       → host.docker.internal:8080  (avec extra_hosts sous Linux)
#
# Piège : dans un conteneur, 127.0.0.1 désigne LE CONTENEUR, pas le VPS.
# Chaque conteneur a sa propre pile réseau, donc son propre loopback — un
# proxy_pass vers 127.0.0.1 depuis nginx conteneurisé ne trouvera jamais le
# backend. Voir DEPLOIEMENT.md, section « 127.0.0.1 et 0.0.0.0 sous Docker ».

upstream parcauto_backend {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les fichiers uploadés (photos de véhicules, proformas) peuvent être
    # volumineux ; la valeur par défaut de nginx (1 Mo) rejetterait l'envoi.
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Fichiers hachés par Vite (assets/index-XXXX.js) : le nom change à chaque
    # build, le cache peut donc être permanent.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # L'application utilise BrowserRouter : une URL comme /engins/12/fiche
    # n'existe pas sur le disque et doit renvoyer index.html, sinon un
    # rechargement de page donne un 404.
    #
    # index.html n'est JAMAIS mis en cache : c'est lui qui référence les
    # fichiers hachés, un index.html périmé renverrait vers des fichiers
    # supprimés après un redéploiement.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://parcauto_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Les exports PDF/Excel d'un gros parc peuvent être lents à générer.
        proxy_read_timeout 120s;
    }

    location /actuator/health {
        proxy_pass http://parcauto_backend;
    }

    # Temps réel : sans les en-têtes Upgrade/Connection, nginx coupe la
    # négociation WebSocket et l'application retombe en mode « hors ligne ».
    location /ws/ {
        proxy_pass http://parcauto_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Une connexion temps réel reste ouverte : sans ce délai long, nginx la
        # fermerait au bout d'une minute et le client se reconnecterait en
        # boucle.
        proxy_read_timeout 3600s;
    }
}
