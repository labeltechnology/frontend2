# Construit l'image Docker du frontend, la publie sur GitHub Container Registry
# (ghcr.io), puis la déploie sur le VPS par SSH.
#
# Secrets requis (Settings → Secrets and variables → Actions → Secrets) :
#   VPS_HOST         adresse IP ou nom du VPS
#   VPS_USER         utilisateur SSH (membre du groupe docker)
#   VPS_SSH_KEY      clé PRIVÉE SSH dédiée au déploiement
#   VPS_PORT         (facultatif) port SSH, 22 par défaut
#   VPS_KNOWN_HOSTS  (facultatif) empreinte du VPS ; sinon relevée par ssh-keyscan
#
# Variables (même écran, onglet Variables) :
#   VITE_API_BASE_URL (obligatoire) URL publique du backend, sans slash final,
#                     ex. http://IP_DU_VPS:8080 — inscrite dans le bundle
#   FRONT_PORT        (facultatif) port publié sur le VPS, 80 par défaut

name: Déploiement

on:
  push:
    branches: [master]
  workflow_dispatch:

# Deux déploiements simultanés se marcheraient dessus sur le VPS.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CONTAINER_NAME: parcauto-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # ghcr.io refuse les majuscules dans le nom d'image.
      - id: meta
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Sans nginx pour relayer /api, un bundle sans URL d'API ne joindrait
      # aucun backend : on échoue tout de suite plutôt qu'après déploiement.
      - name: Vérifier VITE_API_BASE_URL
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Variable VITE_API_BASE_URL manquante (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Préparer la clé SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          fi

      - name: Déployer sur le VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          FRONT_PORT: ${{ vars.FRONT_PORT || '80' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Les valeurs sont transmises en tête du script distant, échappées
          # par printf %q ; le jeton n'apparaît pas dans la ligne de commande.
          {
            for v in IMAGE CONTAINER_NAME FRONT_PORT GHCR_TOKEN; do
              printf '%s=%q\n' "$v" "${!v}"
            done
            printf 'GHCR_USER=%q\n' "$GITHUB_ACTOR"
            cat <<'REMOTE'
          set -euo pipefail

          # Le jeton GitHub expire à la fin du job : on se déconnecte aussitôt
          # le pull terminé, rien ne reste stocké sur le VPS.
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker pull "$IMAGE"
          docker logout ghcr.io

          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "0.0.0.0:$FRONT_PORT:3000" \
            "$IMAGE"

          # Vérifie que le serveur a démarré.
          sleep 3
          if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]; then
            docker logs "$CONTAINER_NAME"
            exit 1
          fi
          if command -v curl >/dev/null; then
            curl -fsS -o /dev/null "http://127.0.0.1:$FRONT_PORT/"
          fi
          echo "Frontend en ligne : $IMAGE"

          # Garde les images récentes pour un retour arrière, supprime le reste.
          docker image prune -af --filter "until=168h" >/dev/null
          REMOTE
          } | ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s'

      - name: Nettoyer la clé
        if: always()
        run: rm -f ~/.ssh/deploy_key
